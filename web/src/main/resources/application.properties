spring.application.name=project202701-web

# ---- 웹 런타임 DB 계정 (D-008) ----
# 접속 정보는 환경변수로만 받는다. 기본값을 두지 않으므로 미설정 시 기동이 실패한다.
# migration(DDL) 계정과 분리된 웹 전용 최소 권한 계정(p27_web)을 사용한다.
# 예: WEB_DB_URL=jdbc:postgresql://<host>:5432/project202701
spring.datasource.url=${WEB_DB_URL}
spring.datasource.username=${WEB_DB_USERNAME}
spring.datasource.password=${WEB_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 커넥션 풀(HikariCP) 기본 설정
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# 서버 포트
server.port=8808

# ---- JSP 뷰 ----
# JSP는 web/src/main/webapp/WEB-INF/jsp 아래에 두어 브라우저에서 직접 접근할 수 없게 한다.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---- 오류 응답 ----
# 스택 트레이스, 예외 메시지, 바인딩 오류 상세를 사용자 응답에 노출하지 않는다.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
