spring.application.name=demo


# ---- PostgreSQL 접속 정보 ----
# DB 서버 IP/포트/DB명에 맞게 수정하세요
spring.datasource.url=jdbc:postgresql://192.168.56.101:5432/postgres
spring.datasource.username=testuser
# 비밀번호는 소스에 직접 쓰지 말고 환경변수 DB_PASSWORD로 넘기는 걸 권장합니다.
# (환경변수가 없으면 콜론 뒤 값을 사용 - 로컬 테스트용, 운영에서는 기본값을 지우세요)
spring.datasource.password=${DB_PASSWORD:test1234!}
spring.datasource.driver-class-name=org.postgresql.Driver

# 커넥션 풀(HikariCP) 기본 설정
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# 서버 포트
server.port=8808