spring.application.name=project202701-db-migration
spring.main.web-application-type=none

# ---- migration(DDL) 전용 계정 ----
# 접속 정보는 환경변수로만 받는다. 기본값을 두지 않으므로 미설정 시 기동이 실패한다.
# migration 계정과 web/collector 런타임 계정은 분리한다. (계정 정책: decisions-claude.md D-008)
spring.datasource.url=${MIGRATION_DB_URL}
spring.datasource.username=${MIGRATION_DB_USERNAME}
spring.datasource.password=${MIGRATION_DB_PASSWORD}

# ---- Flyway ----
spring.flyway.locations=classpath:db/migration
# 스키마 전체 삭제(clean) 차단
spring.flyway.clean-disabled=true
# 적용된 migration 파일이 변경·누락되면 중단한다 (checksum 우회 금지)
spring.flyway.validate-on-migrate=true
